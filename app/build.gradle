plugins { id 'com.android.application' }
android {
 namespace 'local.smbshare'
 compileSdk 36
 defaultConfig { applicationId 'local.smbshare'; minSdk 28; targetSdk 36; versionCode 8; versionName '1.1.0-perf' }
 testBuildType "release"
 buildFeatures { buildConfig true }
 defaultConfig {
  testInstrumentationRunner "local.smbshare.CryptoInstrumentation"
  buildConfigField 'int', 'PERF_CHUNK', providers.gradleProperty('perfChunk').getOrElse('131072')
  buildConfigField 'boolean', 'PERF_PREALLOC', providers.gradleProperty('perfPrealloc').getOrElse('false')
  buildConfigField 'int', 'PERF_FAIL_AFTER', providers.gradleProperty('perfFailAfter').getOrElse('0')
  buildConfigField 'int', 'PERF_WINDOW', providers.gradleProperty('perfWindow').getOrElse('1')
  buildConfigField 'boolean', 'PERF_NATIVE', providers.gradleProperty('perfNative').getOrElse('false')
 }
 buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/*.kotlin_module', 'META-INF/INDEX.LIST', 'META-INF/services/java.security.Provider', 'org/bouncycastle/pqc/**', 'org/bouncycastle/x509/*.properties'] }
}
dependencies { implementation 'com.hierynomus:smbj:0.15.0'; implementation 'org.slf4j:slf4j-nop:2.0.17'; testImplementation 'junit:junit:4.13.2' }
